<div class="nav-wrapper">
  <div class="side-nav">
    <div class="data-wrapper">
      <div class="data-line" *ngFor="let item of listOfNavItems" [class.selected]="selected == item?.heading"
           (click)="updateNav(item.heading)">
        <ng-container *ngIf="(!item?.isLoggedInRoute && !isLoggedIn) || (isLoggedIn && item?.heading != 'LOGIN')"><p
          class="data">{{ item?.heading }}</p>
          <fa-icon [icon]="item?.type" size="lg" class="custom-icon"></fa-icon>
        </ng-container>
      </div>
    </div>
  </div>
</div>
